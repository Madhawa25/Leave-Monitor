<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leave Monitor</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7fb;color:#172033}
header{background:linear-gradient(135deg,#1769e0,#5b8def);color:white;padding:24px 20px 28px;border-radius:0 0 24px 24px}
h1{margin:0;font-size:26px}.sub{opacity:.85;margin-top:5px}
.container{max-width:1000px;margin:auto;padding:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:-15px}.card{background:white;border-radius:16px;padding:16px;box-shadow:0 5px 18px #17345d12}.num{font-size:27px;font-weight:700}.label{font-size:12px;color:#697386}
.tabs{display:flex;gap:8px;margin:16px 0;overflow:auto}.tabs button{border:0;background:white;padding:10px 15px;border-radius:12px;font-weight:600;white-space:nowrap}.tabs button.active{background:#1769e0;color:white}
.section{display:none}.section.active{display:block}
.calendar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.calendar-head button{border:0;background:white;border-radius:10px;padding:9px 13px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dow{text-align:center;color:#788397;font-size:12px;padding:5px}.day{min-height:72px;background:white;border-radius:10px;padding:7px;cursor:pointer;border:1px solid transparent}.day:hover{border-color:#1769e0}.day.muted{opacity:.35}.day.selected{border:2px solid #1769e0}.daynum{font-weight:700;font-size:13px}.dot{display:block;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px;color:#1769e0}
.list{margin-top:15px}.leave{display:flex;justify-content:space-between;gap:10px;padding:13px;background:white;border-radius:12px;margin:7px 0}.pill{font-size:11px;padding:4px 8px;border-radius:20px;background:#e8f0ff;color:#1769e0}
input,select{width:100%;padding:12px;border:1px solid #d9e0ea;border-radius:10px;margin:6px 0 12px;background:white}label{font-size:13px;font-weight:600}
.form{background:white;padding:18px;border-radius:16px}.primary{width:100%;border:0;background:#1769e0;color:white;padding:13px;border-radius:11px;font-weight:700;font-size:15px}
.employee{display:flex;justify-content:space-between;align-items:center;padding:13px;background:white;border-radius:12px;margin:7px 0}.delete{border:0;background:#fff0f0;color:#d33;border-radius:8px;padding:7px}
.empty{text-align:center;color:#7a8597;padding:24px}
@media(max-width:600px){.stats{grid-template-columns:repeat(3,1fr)}.card{padding:12px}.num{font-size:21px}.day{min-height:62px;padding:5px}.dot{font-size:9px}}
</style>
</head>
<body>
<header><div class="container"><h1>Leave Monitor</h1><div class="sub">Staff leave calendar &amp; attendance overview</div></div></header>
<div class="container">
<div class="stats">
<div class="card"><div class="num" id="todayCount">0</div><div class="label">On leave today</div></div>
<div class="card"><div class="num" id="empCount">0</div><div class="label">Employees</div></div>
<div class="card"><div class="num" id="monthCount">0</div><div class="label">This month</div></div>
</div>
<div class="tabs">
<button class="active" data-tab="calendar">📅 Calendar</button>
<button data-tab="add">➕ Add Leave</button>
<button data-tab="employees">👥 Employees</button>
</div>

<section id="calendar" class="section active">
<div class="calendar-head"><button id="prev">‹</button><h2 id="monthTitle"></h2><button id="next">›</button></div>
<div class="grid" id="calendarGrid"></div>
<div class="list"><h3 id="selectedTitle"></h3><div id="selectedList"></div></div>
</section>

<section id="add" class="section">
<div class="form">
<h2>Add Leave</h2>
<label>Employee</label><select id="employee"></select>
<label>Leave type</label><select id="type"><option>Annual Leave</option><option>Casual Leave</option><option>Medical Leave</option><option>Other</option></select>
<label>From date</label><input type="date" id="from">
<label>To date</label><input type="date" id="to">
<label>Remarks (optional)</label><input id="remarks" placeholder="e.g. Personal work">
<button class="primary" id="save">Save Leave</button>
</div>
<div class="list"><h3>Recent Leave Entries</h3><div id="allLeaves"></div></div>
</section>

<section id="employees" class="section">
<div class="form"><h2>Add Employee</h2><input id="newEmployee" placeholder="Employee name"><button class="primary" id="addEmployee">Add Employee</button></div>
<div class="list" id="employeeList"></div>
</section>
</div>

<script>
const KEY='leaveMonitor_v1';
let data=JSON.parse(localStorage.getItem(KEY)||'null')||{
 employees:["Employee 1","Employee 2","Employee 3"], leaves:[]
};
let view=new Date(), selected=new Date();
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function iso(d){return d.toISOString().slice(0,10)}
function parse(s){let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function inRange(day,l){return day>=parse(l.from)&&day<=parse(l.to)}
function render(){
 $('empCount').textContent=data.employees.length;
 let today=iso(new Date());
 $('todayCount').textContent=data.leaves.filter(l=>inRange(new Date(),l)).length;
 let ym=view.getFullYear()+'-'+String(view.getMonth()+1).padStart(2,'0');
 $('monthCount').textContent=data.leaves.filter(l=>l.from.startsWith(ym)||l.to.startsWith(ym)|| (parse(l.from)<=new Date(view.getFullYear(),view.getMonth()+1,0)&&parse(l.to)>=new Date(view.getFullYear(),view.getMonth(),1))).length;
 $('employee').innerHTML=data.employees.map((e,i)=>`<option value="${i}">${e}</option>`).join('');
 renderCalendar(); renderEmployees(); renderLeaves();
}
function renderCalendar(){
 let y=view.getFullYear(),m=view.getMonth();
 $('monthTitle').textContent=view.toLocaleString('default',{month:'long',year:'numeric'});
 let first=new Date(y,m,1), start=new Date(y,m,1-first.getDay());
 let html=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="dow">${x}</div>`).join('');
 for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let ds=iso(d), ls=data.leaves.filter(l=>inRange(d,l));let cls=d.getMonth()!=m?'muted':'';if(ds===iso(selected))cls+=' selected';
 html+=`<div class="day ${cls}" data-date="${ds}"><div class="daynum">${d.getDate()}</div>${ls.slice(0,3).map(l=>`<span class="dot">● ${l.name}</span>`).join('')}</div>`}
 $('calendarGrid').innerHTML=html;
 document.querySelectorAll('.day').forEach(x=>x.onclick=()=>{selected=parse(x.dataset.date);renderCalendar();renderSelected()});
 renderSelected();
}
function renderSelected(){
 let ds=iso(selected), ls=data.leaves.filter(l=>inRange(selected,l));
 $('selectedTitle').textContent=selected.toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});
 $('selectedList').innerHTML=ls.length?ls.map(l=>`<div class="leave"><div><b>${l.name}</b><br><small>${l.type}${l.remarks?' · '+l.remarks:''}</small></div><span class="pill">${l.from===l.to?'Full day':l.from+' → '+l.to}</span></div>`).join(''):'<div class="empty">No employees are on leave on this date.</div>';
}
function renderEmployees(){
 $('employeeList').innerHTML=data.employees.map((e,i)=>`<div class="employee"><span>${e}</span><button class="delete" onclick="removeEmployee(${i})">Delete</button></div>`).join('');
}
function renderLeaves(){
 $('allLeaves').innerHTML=data.leaves.length?data.leaves.slice().reverse().map((l,i)=>`<div class="leave"><div><b>${l.name}</b><br><small>${l.type} · ${l.from} → ${l.to}</small></div><button class="delete" onclick="removeLeave(${data.leaves.length-1-i})">Delete</button></div>`).join(''):'<div class="empty">No leave entries yet.</div>';
}
function removeEmployee(i){if(confirm('Delete this employee? Existing leave records will remain.')){data.employees.splice(i,1);save()}}
function removeLeave(i){data.leaves.splice(i,1);save()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active')});
$('prev').onclick=()=>{view.setMonth(view.getMonth()-1);render()};
$('next').onclick=()=>{view.setMonth(view.getMonth()+1);render()};
$('addEmployee').onclick=()=>{let n=$('newEmployee').value.trim();if(n){data.employees.push(n);$('newEmployee').value='';save()}};
$('save').onclick=()=>{
 let idx=$('employee').value,from=$('from').value,to=$('to').value;
 if(idx===''||!from||!to)return alert('Please complete employee and dates.');
 if(to<from)return alert('To date cannot be before From date.');
 data.leaves.push({name:data.employees[idx],type:$('type').value,from,to,remarks:$('remarks').value.trim()});
 $('from').value='';$('to').value='';$('remarks').value='';selected=parse(from);view=new Date(selected);save();
 document.querySelector('[data-tab="calendar"]').click();
};
render();
</script>
</body>
</html>
